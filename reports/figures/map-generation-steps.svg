<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#243247" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9aa8ba"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .step { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .title { font-size: 42px; font-weight: 700; fill: #172238; }
      .main { font-size: 34px; font-weight: 700; fill: #172238; }
      .sub { font-size: 25px; fill: #5e6b7e; }
      .tiny { font-size: 22px; fill: #758297; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="112" text-anchor="middle" class="font title">一局地图是怎么生成的？</text>
  <text x="960" y="158" text-anchor="middle" class="font sub">从总件数，到最终摆进固定 10 列地图</text>

  <!-- flow arrows -->
  <path d="M480 545 H555" stroke="#9aa8ba" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M930 545 H1005" stroke="#9aa8ba" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1380 545 H1455" stroke="#9aa8ba" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- step 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="240" width="390" height="610" rx="34" fill="#ffffff"/>
    <rect x="90" y="240" width="390" height="94" rx="34" fill="#be7b1b"/>
    <rect x="90" y="300" width="390" height="34" fill="#be7b1b"/>
  </g>
  <circle cx="150" cy="287" r="31" fill="#ffffff" fill-opacity="0.18"/>
  <text x="150" y="297" text-anchor="middle" class="font step">1</text>
  <text x="285" y="298" text-anchor="middle" class="font step">决定总件数</text>
  <g transform="translate(163 395)">
    <rect x="0" y="0" width="244" height="142" rx="26" fill="#fff5e7" stroke="#e9bc77" stroke-width="3"/>
    <text x="122" y="57" text-anchor="middle" class="font main">N</text>
    <text x="122" y="105" text-anchor="middle" class="font sub">10～60 件</text>
  </g>
  <text x="285" y="620" text-anchor="middle" class="font main">先定这一局</text>
  <text x="285" y="668" text-anchor="middle" class="font main">一共有多少件</text>
  <text x="285" y="755" text-anchor="middle" class="font tiny">10、60 是特殊边界</text>
  <text x="285" y="792" text-anchor="middle" class="font tiny">中间大致呈钟形分布</text>

  <!-- step 2 -->
  <g filter="url(#shadow)">
    <rect x="540" y="240" width="390" height="610" rx="34" fill="#ffffff"/>
    <rect x="540" y="240" width="390" height="94" rx="34" fill="#3277bd"/>
    <rect x="540" y="300" width="390" height="34" fill="#3277bd"/>
  </g>
  <circle cx="600" cy="287" r="31" fill="#ffffff" fill-opacity="0.18"/>
  <text x="600" y="297" text-anchor="middle" class="font step">2</text>
  <text x="735" y="298" text-anchor="middle" class="font step">分配品质数量</text>
  <g transform="translate(607 400)">
    <circle cx="38" cy="45" r="33" fill="#edf1f6" stroke="#cbd3df" stroke-width="3"/>
    <circle cx="104" cy="45" r="33" fill="#4c9be8"/>
    <circle cx="170" cy="45" r="33" fill="#9a67dc"/>
    <circle cx="236" cy="45" r="33" fill="#e5af27"/>
    <circle cx="38" cy="115" r="33" fill="#9a67dc"/>
    <circle cx="104" cy="115" r="33" fill="#9a67dc"/>
    <circle cx="170" cy="115" r="33" fill="#e5af27"/>
    <circle cx="236" cy="115" r="33" fill="#e5af27"/>
  </g>
  <text x="735" y="610" text-anchor="middle" class="font main">先满足保底</text>
  <text x="735" y="660" text-anchor="middle" class="font sub">1 白 · 1 蓝 · 3 紫 · 3 金</text>
  <text x="735" y="745" text-anchor="middle" class="font tiny">剩余 N−8 件再分品质</text>
  <text x="735" y="782" text-anchor="middle" class="font tiny">比例会跟着 N 变化</text>

  <!-- step 3 -->
  <g filter="url(#shadow)">
    <rect x="990" y="240" width="390" height="610" rx="34" fill="#ffffff"/>
    <rect x="990" y="240" width="390" height="94" rx="34" fill="#6b42c9"/>
    <rect x="990" y="300" width="390" height="34" fill="#6b42c9"/>
  </g>
  <circle cx="1050" cy="287" r="31" fill="#ffffff" fill-opacity="0.18"/>
  <text x="1050" y="297" text-anchor="middle" class="font step">3</text>
  <text x="1185" y="298" text-anchor="middle" class="font step">抽具体藏品</text>
  <g transform="translate(1068 392)">
    <rect x="0" y="15" width="82" height="82" rx="12" fill="#4c9be8"/>
    <rect x="104" y="15" width="55" height="124" rx="12" fill="#9a67dc"/>
    <rect x="181" y="15" width="124" height="124" rx="12" fill="#e5af27"/>
    <path d="M30 56 L41 34 L52 56 L41 78 Z" fill="#ffffff" fill-opacity="0.8"/>
    <path d="M119 75 L132 48 L145 75 L132 102 Z" fill="#ffffff" fill-opacity="0.8"/>
    <path d="M221 76 L243 38 L265 76 L243 114 Z" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  <text x="1185" y="610" text-anchor="middle" class="font main">品质定好以后</text>
  <text x="1185" y="658" text-anchor="middle" class="font main">再抽具体名字</text>
  <text x="1185" y="738" text-anchor="middle" class="font tiny">非彩：近似等概率</text>
  <text x="1185" y="775" text-anchor="middle" class="font tiny">彩色：使用历史权重</text>
  <text x="1185" y="812" text-anchor="middle" class="font tiny">形状由藏品自己带出</text>

  <!-- step 4 -->
  <g filter="url(#shadow)">
    <rect x="1440" y="240" width="390" height="610" rx="34" fill="#ffffff"/>
    <rect x="1440" y="240" width="390" height="94" rx="34" fill="#078650"/>
    <rect x="1440" y="300" width="390" height="34" fill="#078650"/>
  </g>
  <circle cx="1500" cy="287" r="31" fill="#ffffff" fill-opacity="0.18"/>
  <text x="1500" y="297" text-anchor="middle" class="font step">4</text>
  <text x="1635" y="298" text-anchor="middle" class="font step">按顺序摆进地图</text>
  <g transform="translate(1520 385)">
    <rect x="0" y="0" width="230" height="172" rx="12" fill="#f2faf6" stroke="#83c9a7" stroke-width="3"/>
    <g stroke="#b9dcca" stroke-width="2">
      <path d="M23 0V172 M46 0V172 M69 0V172 M92 0V172 M115 0V172 M138 0V172 M161 0V172 M184 0V172 M207 0V172"/>
      <path d="M0 23H230 M0 46H230 M0 69H230 M0 92H230 M0 115H230 M0 138H230 M0 161H230"/>
    </g>
    <rect x="2" y="2" width="67" height="44" rx="6" fill="#e5af27"/>
    <rect x="71" y="2" width="44" height="67" rx="6" fill="#9a67dc"/>
    <rect x="117" y="2" width="90" height="44" rx="6" fill="#4c9be8"/>
    <rect x="2" y="48" width="67" height="67" rx="6" fill="#d7dce4"/>
    <rect x="117" y="48" width="44" height="90" rx="6" fill="#e5af27"/>
  </g>
  <text x="1635" y="610" text-anchor="middle" class="font main">按 index 顺序</text>
  <text x="1635" y="658" text-anchor="middle" class="font main">从左上角依次放</text>
  <text x="1635" y="745" text-anchor="middle" class="font tiny">固定 10 列 · 不旋转</text>
  <text x="1635" y="782" text-anchor="middle" class="font tiny">找到第一个能放下的位置</text>

  <rect x="335" y="925" width="1250" height="82" rx="41" fill="#172238"/>
  <text x="960" y="978" text-anchor="middle" class="font" font-size="29" font-weight="700" fill="#ffffff">总件数  →  品质数量  →  具体藏品与形状  →  最终地图</text>
</svg>
